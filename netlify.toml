[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# PWA: the service worker and app shell must always be revalidated,
# hashed bundles can be cached forever, and the manifest needs its own MIME type.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Same-origin proxies for public APIs that do not expose browser CORS headers.
# These are plain URL rewrites: no keys, tokens or secrets are involved.
[[redirects]]
  from = "/api/crossref/*"
  to = "https://api.crossref.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/europepmc/*"
  to = "https://www.ebi.ac.uk/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/arxiv/*"
  to = "https://export.arxiv.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/unpaywall/*"
  to = "https://api.unpaywall.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
